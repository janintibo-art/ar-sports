name: Build APK Quest

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  VENDORS_VERSION: "5.1.0"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Godot + plugin
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/godot-cache
          key: godot-${{ env.GODOT_VERSION }}-vendors-${{ env.VENDORS_VERSION }}

      - name: Télécharger Godot, modèles Android et plugin Meta
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p ~/godot-cache && cd ~/godot-cache
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          curl -fsSL -o tpl.tpz "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p templates
          unzip -qj tpl.tpz 'templates/android_*' 'templates/version.txt' -d templates
          rm tpl.tpz
          curl -fsSL -o vendors.zip "https://github.com/GodotVR/godot_openxr_vendors/releases/download/${VENDORS_VERSION}-stable/godotopenxrvendorsaddon.zip"
          unzip -q vendors.zip -d vendors && rm vendors.zip

      - name: Installer Godot et le SDK Android
        run: |
          set -e
          chmod +x ~/godot-cache/godot
          sudo ln -sf "$HOME/godot-cache/godot" /usr/local/bin/godot
          TPL="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TPL" && cp ~/godot-cache/templates/* "$TPL/"
          mkdir -p addons && cp -r ~/godot-cache/vendors/asset/addons/godotopenxrvendors addons/
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.1.0" "ndk;29.0.14206865" > /dev/null
          SETTINGS_MINOR="${GODOT_VERSION%.*}"
          mkdir -p ~/.config/godot
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$SDK" "$JAVA_HOME" > "$HOME/.config/godot/editor_settings-${SETTINGS_MINOR}.tres"
          godot --version

      - name: Importer le projet
        run: |
          godot --headless --import > import1.log 2>&1 || echo "Premier import : sortie $? (plantage connu à la fermeture, sans effet)"
          godot --headless --import 2>&1 | grep -vE "OpenXR-Loader" || true

      - name: Auto-test (scripts + physique du bowling)
        run: |
          set -o pipefail
          timeout 300 godot --headless --fixed-fps 90 -- --selftest 2>&1 | grep -vE "OpenXR-Loader" | tee selftest.log
          grep -q "SELFTEST score=" selftest.log
          if grep -qE "SCRIPT ERROR|Parse Error" selftest.log; then exit 1; fi
          for game in darts pingpong petanque molkky palet billard babyfoot tir grenouille nav; do
            grep -q "SELFTEST ${game}=OK" selftest.log || exit 1
          done

      - name: Vérifier interface et navigation
        run: |
          set -o pipefail
          timeout 30 godot --headless -s tools/check_visual_ui.gd 2>&1 | tee visual_ui.log
          grep -q "SELFTEST visual_ui=OK" visual_ui.log
          if grep -qE "SCRIPT ERROR|Parse Error" visual_ui.log; then exit 1; fi

      - name: Vérifier les deux profils graphiques
        run: |
          set -o pipefail
          timeout 60 godot --headless -s tools/check_v19_style.gd 2>&1 | tee style.log
          grep -q "SELFTEST style_v19=OK" style.log
          if grep -qE "SCRIPT ERROR|Parse Error" style.log; then exit 1; fi

      - name: Vérifier aide du menu et effets
        run: |
          set -o pipefail
          timeout 30 godot --headless -s tools/check_v20_feedback.gd 2>&1 | tee feedback.log
          grep -q "SELFTEST feedback_v20=OK" feedback.log
          if grep -qE "SCRIPT ERROR|Parse Error" feedback.log; then exit 1; fi

      - name: Vérifier les réglages de confort
        run: |
          set -o pipefail
          timeout 30 godot --headless -s tools/check_v21_comfort.gd 2>&1 | tee comfort.log
          grep -q "SELFTEST comfort_v21=OK" comfort.log
          if grep -qE "SCRIPT ERROR|Parse Error" comfort.log; then exit 1; fi

      - name: Vérifier les réglages des gestes
        run: |
          set -o pipefail
          timeout 30 godot --headless -s tools/check_v22_gestures.gd 2>&1 | tee gestures.log
          grep -q "SELFTEST gestures_v22=OK" gestures.log
          if grep -qE "SCRIPT ERROR|Parse Error" gestures.log; then exit 1; fi

      - name: Vérifier le guide des commandes
        run: |
          set -o pipefail
          timeout 30 godot --headless -s tools/check_v23_guide.gd 2>&1 | tee guide.log
          grep -q "SELFTEST guide_v23=OK" guide.log
          if grep -qE "SCRIPT ERROR|Parse Error" guide.log; then exit 1; fi

      - name: Vérifier les réglages audio
        run: |
          set -o pipefail
          timeout 30 godot --headless -s tools/check_v24_audio.gd 2>&1 | tee audio.log
          grep -q "SELFTEST audio_v24=OK" audio.log
          if grep -qE "SCRIPT ERROR|Parse Error" audio.log; then exit 1; fi

      - name: Vérifier les modèles de tir
        run: |
          set -o pipefail
          timeout 30 godot --headless -s tools/check_v25_models.gd 2>&1 | tee models.log
          grep -q "SELFTEST models_v25=OK" models.log
          if grep -qE "SCRIPT ERROR|Parse Error" models.log; then exit 1; fi

      - name: Vérifier arc, flèches et couteaux
        run: |
          set -o pipefail
          timeout 30 godot --headless -s tools/check_v26_ranged.gd 2>&1 | tee ranged.log
          grep -q "SELFTEST ranged_v26=OK" ranged.log
          if grep -qE "SCRIPT ERROR|Parse Error" ranged.log; then exit 1; fi

      - name: Vérifier les graphismes des fléchettes
        run: |
          set -o pipefail
          timeout 30 godot --headless -s tools/check_v27_darts_art.gd 2>&1 | tee darts_art.log
          grep -q "SELFTEST darts_art_v27=OK" darts_art.log
          if grep -qE "SCRIPT ERROR|Parse Error" darts_art.log; then exit 1; fi

      - name: Vérifier les équipements de ping-pong
        run: |
          set -o pipefail
          timeout 30 godot --headless -s tools/check_v28_ping_art.gd 2>&1 | tee ping_art.log
          grep -q "SELFTEST ping_art_v28=OK" ping_art.log
          if grep -qE "SCRIPT ERROR|Parse Error" ping_art.log; then exit 1; fi

      - name: Vérifier les graphismes des billes de billard
        run: |
          set -o pipefail
          timeout 30 godot --headless -s tools/check_v29_billard_art.gd 2>&1 | tee billard_art.log
          grep -q "SELFTEST billard_art_v29=OK" billard_art.log
          if grep -qE "SCRIPT ERROR|Parse Error" billard_art.log; then exit 1; fi

      - name: Vérifier la queue de billard v30
        run: |
          set -o pipefail
          timeout 30 godot --headless -s tools/check_v30_billard_cue.gd 2>&1 | tee billard_cue.log
          grep -q "SELFTEST billard_cue_v30=OK" billard_cue.log
          if grep -qE "SCRIPT ERROR|Parse Error" billard_cue.log; then exit 1; fi

      - name: Vérifier la table de billard v36
        run: |
          set -o pipefail
          timeout 30 godot --headless -s tools/check_v36_billard_table.gd 2>&1 | tee billard_table.log
          grep -q "SELFTEST billard_table_v36=OK" billard_table.log
          if grep -qE "SCRIPT ERROR|Parse Error" billard_table.log; then exit 1; fi

      - name: Vérifier les graphismes du baby-foot v37
        run: |
          set -o pipefail
          timeout 30 godot --headless -s tools/check_v37_babyfoot_art.gd 2>&1 | tee babyfoot_art.log
          grep -q "SELFTEST babyfoot_art_v37=OK" babyfoot_art.log
          if grep -qE "SCRIPT ERROR|Parse Error" babyfoot_art.log; then exit 1; fi

      - name: Vérifier joueurs et balle du baby-foot v41
        run: |
          set -o pipefail
          timeout 30 godot --headless -s tools/check_v41_babyfoot_players.gd 2>&1 | tee babyfoot_players.log
          grep -q "SELFTEST babyfoot_players_v41=OK" babyfoot_players.log
          if grep -qE "SCRIPT ERROR|Parse Error" babyfoot_players.log; then exit 1; fi

      - name: Vérifier détails des joueurs baby-foot v43
        run: |
          set -o pipefail
          timeout 30 godot --headless -s tools/check_v43_babyfoot_players.gd 2>&1 | tee babyfoot_players_v43.log
          grep -q "SELFTEST babyfoot_player_detail_v43=OK" babyfoot_players_v43.log
          if grep -qE "SCRIPT ERROR|Parse Error" babyfoot_players_v43.log; then exit 1; fi

      - name: Vérifier terrain du baby-foot v45
        run: |
          set -o pipefail
          timeout 30 godot --headless -s tools/check_v45_babyfoot_field.gd 2>&1 | tee babyfoot_field.log
          grep -q "SELFTEST babyfoot_field_v45=OK" babyfoot_field.log
          if grep -qE "SCRIPT ERROR|Parse Error" babyfoot_field.log; then exit 1; fi

      - name: Vérifier que les menus n'entrent pas dans les tables v50
        run: |
          set -o pipefail
          timeout 60 godot --headless -s tools/check_v50_menu_clearance.gd 2>&1 | tee menu_clearance.log
          grep -q "SELFTEST menu_clearance_v50=OK" menu_clearance.log
          if grep -qE "SCRIPT ERROR|Parse Error" menu_clearance.log; then exit 1; fi

      - name: Vérifier la fusion des maillages du baby-foot
        run: |
          set -o pipefail
          timeout 60 godot --headless -s tools/check_v51_babyfoot_merge.gd 2>&1 | tee babyfoot_merge.log
          grep -q "SELFTEST babyfoot_merge_v51=OK" babyfoot_merge.log
          if grep -qE "SCRIPT ERROR|Parse Error" babyfoot_merge.log; then exit 1; fi

      - name: Vérifier le jeu de la grenouille v52
        run: |
          set -o pipefail
          timeout 60 godot --headless -s tools/check_v52_grenouille.gd 2>&1 | tee grenouille.log
          grep -q "SELFTEST grenouille_v52=OK" grenouille.log
          if grep -qE "SCRIPT ERROR|Parse Error" grenouille.log; then exit 1; fi

      - name: Exporter l'APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/keys/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/" export_presets.cfg
          mkdir -p build
          godot --headless --install-android-build-template --export-debug "Meta Quest" build/ar_sports.apk 2>&1 | grep -vE "OpenXR-Loader"
          test -f build/ar_sports.apk
          ls -la build

      - name: Garder l'APK comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: ar_sports-apk
          path: build/ar_sports.apk

      - name: Publier dans la release « latest »
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/ar_sports.apk --target "${{ github.sha }}" --title "AR Sports, build ${{ github.run_number }}" --notes "APK de test pour Meta Quest (commit ${{ github.sha }})." --latest
